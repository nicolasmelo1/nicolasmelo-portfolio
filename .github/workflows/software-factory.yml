name: software factory

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  factory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install sf
        run: cargo install --git https://github.com/nicolasmelo1/software-factory --locked
      # verify first: a check that stopped firing makes the run below
      # meaningless, and it is the cheaper failure to discover.
      - name: Prove the checks still fire
        run: sf verify
      # `github.base_ref` is attacker-controlled on a pull request from a fork,
      # and `${{ }}` is substituted before the shell sees it — interpolating it
      # into `run:` is a script injection. Passed through the environment and
      # quoted instead.
      - name: Check the repository
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: sf check --changed "origin/$BASE_REF"

  hazards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Committed secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Dependency vulnerabilities
        run: npm audit --audit-level=high
      # A second scanner on the same concern: npm audit only knows the npm
      # advisory database, osv-scanner reads OSV across ecosystems.
      - name: Dependency vulnerabilities (osv-scanner)
        uses: google/osv-scanner-action/osv-scanner-action@e69cc6c86b31f1e7e23935bbe7031b50e51082de # v2.0.2
        with:
          scan-args: |-
            --lockfile=package-lock.json
      # semgrep is a Python tool. `npx semgrep` resolved to an unrelated npm
      # package at version 0.0.1 with no executable, which is why this step only
      # ever failed in CI. pipx is preinstalled on the runners, and an explicit
      # public ruleset keeps the scan deterministic where `--config auto` would
      # depend on the registry.
      - name: Insecure patterns
        run: |
          pipx install semgrep
          semgrep scan --config p/default --error --metrics=off \
            --exclude .software-factory --exclude public
      - name: Dead code
        run: npx --yes knip
      - name: Performance regression (vitest bench, tinybench under the hood)
        run: npm run bench
      # Both halves of this check live upstream — a dependency's prebuilt config
      # and someone else's Hugging Face repo — so it needs the network and it
      # needs to re-run even when nothing here changed.
      - name: Browser model registry
        run: npm run verify:models

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Lint (includes eslint-plugin-security)
        run: npm run lint
      - name: Types
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  # Deploying from here rather than from Vercel's git integration, which is
  # disconnected on purpose: it deploys every push the moment it lands, before
  # anything above has had a chance to fail. `needs` is the whole point — a
  # commit reaches production only after sf check, the scanners and the build
  # have all passed on that exact commit.
  deploy:
    needs: [factory, hazards, checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Two pushes landing close together would otherwise race to alias the
    # production domain, and the loser is whichever finishes last, not whichever
    # is newer. Serialised instead, and not cancelled: a half-uploaded
    # deployment is worse than a slightly stale one.
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      # The CLI reads all three from the environment. Passing the token as
      # `--token=${{ }}` instead — which is what Vercel's own example does —
      # puts it in the runner's process list and in any command echo, so it is
      # passed this way for the same reason BASE_REF is above.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      # Pinned for the same reason the actions above are pinned by digest: a
      # deploy that changes because someone else published is not a deploy of
      # this commit.
      - name: Install Vercel CLI
        run: npm install --global vercel@59.3.0
      - run: npm ci
      # Pulls the project settings and the production environment variables —
      # OPENROUTER_API_KEY and GITHUB_TOKEN live in the Vercel project, not in
      # this repository's secrets, because the running site is what needs them.
      - name: Pull the project settings
        run: vercel pull --yes --environment=production
      # Built here, not on Vercel: `deploy --prebuilt` then uploads
      # `.vercel/output` only, so the source never leaves the runner and the
      # build is not paid for twice.
      - name: Build
        run: vercel build --prod
      - name: Deploy
        id: deploy
        run: echo "url=$(vercel deploy --prebuilt --prod)" >> "$GITHUB_OUTPUT"
